[music]

directories = [
    "/Users/admin/Music",
    "/Users/admin/Downloads"
]

formats = ["mp3", "wav", "flac", "ogg", "oga", "m4a", "aac", "alac", "aif", "aiff"]
download_format = "m4a"

[library]
enabled = true
database_path = "~/Music/TPlay/tplay_library.db"
sync_folder = "~/Library/Mobile Documents/com~apple~CloudDocs/TPlay"
export_serato = true
export_rekordbox = true
export_traktor = true
export_json = true

[player]
volume = 80
fps = 30

[ytdlp]
cookies_from_browser = ["chrome", "safari"]

[telegram]
enabled = true
mode = "bot"
bot_token = ""
download_root = "/Users/admin/Music/TPlay/Telegram"
discover_chats = true
sync_on_start = false
sync_on_open_folder = true
download_on_play = true
auto_analyze_after_download = true
create_playlist_per_chat = true
max_file_size_mb = 300
allowed_extensions = [
    "mp3",
    "m4a",
    "wav",
    "flac",
    "aiff",
    "aac",
    "ogg",
    "opus"
]

[columns]
time = true
bpm = true
key = true
kbps = true
rate = true
size = true
genre = false
order = ["time", "bpm", "key", "kbps", "rate", "size", "genre"]

[demucs]
# 2 = htdemucs_ft_vocals -> vocals + no_vocals.
# 4 = htdemucs drums/bass/other/vocals.
# auto = try ONNX Runtime CPU for 2/4 stems, fallback to bundled CPU.
# cpu = bundled demucs.cpp only.
# onnx_cpu = require ONNX Runtime CPU and fail if unavailable.
# coreml = require ONNX/CoreML CPU+GPU and fail if unavailable.
backend = "auto"
stems = 2
two_stem_source = "vocals"
output_directory = ""
output_format = "wav"
jobs = 0
overlap = 0.25
shift_seconds = 0.5

[autocue]
enabled = true
write_serato = true
write_traktor = true
write_json = true
backup_before_write = true
overwrite_existing_cues = true
cleanup_after_write = true
# Used only as a tie-break when Serato and Traktor metadata disagree.
# The TPlay library database is not used as a cue source during sync.
sync_prefer = "serato"
mode = "structure"
beats_per_bar = 4
snap_to_bar = true
waveform_color = "gray"
playhead_color = "green"

# start, intro_end, verse_start, chorus_start, 
# bridge_start, breakdown, buildup, first_drop, 
# second_drop, outro_start, energy_peak, mix_in, mix_out.
#
# Cue colors: green, blue, red, orange, yellow, purple, white, cyan,
# grey/gray, or custom hex values like "#35d66b" / "0x35d66b".

[[autocue.cues]]
index = 0
name = "START"
type = "start"
color = "green"

[[autocue.cues]]
index = 1
name = "VERSE START"
type = "verse_start"
color = "red"

[[autocue.cues]]
index = 2
name = "DROP 1"
type = "first_drop"
color = "blue"

[[autocue.cues]]
index = 3
name = "DROP 2"
type = "second_drop"
color = "orange"

[[autocue.cues]]
index = 4
name = "OUTRO"
type = "outro_start"
color = "yellow"

